name: 03. Foto Pulang Reminder (17:30 WIB)

on:
  schedule:
    # 17:30 WIB = 10:30 UTC (Senin s/d Jumat)
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # Memungkinkan testing manual lewat tombol "Run workflow" di GitHub

jobs:
  send-evening-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Send Evening Photo Reminder
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
          ABSEN_URL: ${{ secrets.ABSEN_URL || 'https://monev.maganghub.kemnaker.go.id' }}
          TIMEZONE: 'Asia/Jakarta'
          WORK_DAYS_ONLY: 'true'
        run: |
          python send_reminder.py --type evening
